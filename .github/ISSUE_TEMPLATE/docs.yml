name: Documentation
description: Report an issue with our documentation
title: 'docs: '
labels: ['type: docs']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to submit a documentation-related issue!
        
        Please make use of the provided template to help us understand the issue better.
  - type: markdown
    attributes:
      value: |
        ### Resources
        - Documentation: https://docs.vikrai.com/
        - Contribution Guidelines: https://github.com/sadhakaai/VikrAI/blob/master/CONTRIBUTING.md
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What type of documentation issue is this?
      options:
        - Error/Bug
        - Unclear Explanation
        - Missing Information
        - Outdated Content
        - Other (specify below)
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Pre-submission Checklist
      options:
        - label: "I have searched for similar issues before creating this one"
          required: true
        - label: "This issue is not a duplicate. Before opening a new issue, please search existing issues: https://github.com/sadhakaai/VikrAI/issues"
          required: true
  - type: input
    attributes:
      label: Affected Documentation Page
      description: Please provide the URL of the documentation page with the issue.
      placeholder: "https://docs.vikrai.com/..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Issue Description
      description: Please provide a clear and detailed description of the documentation issue.
      placeholder: |
        For example:
        - What is unclear or incorrect?
        - What additional documentation would be helpful?
        - How could we make this documentation better?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution (Optional)
      description: If you have a suggestion for how to improve the documentation, please let us know.
      placeholder: |
        For example:
        - Reword this paragraph to...
        - Add a new section about...
        - Include an example showing...
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context (Optional)
      description: Add any other context about the problem here.
    validations:
      required: false
