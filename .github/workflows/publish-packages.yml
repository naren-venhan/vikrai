name: Publish Packages to GitHub npm Registry

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (leave empty for all)'
        required: false
        default: ''
      tag:
        description: 'Tag to use for publication (latest, next, beta)'
        required: false
        default: 'latest'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vikrai'
      
      - name: Configure .npmrc
        run: |
          echo "@vikrai:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
      
      - name: Install dependencies
        run: yarn
      
      - name: Build packages
        run: yarn build
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
      
      - name: Publish specific package
        if: ${{ github.event.inputs.package != '' }}
        run: |
          echo "Publishing single package: ${{ github.event.inputs.package }}"
          cd packages/${{ github.event.inputs.package }}
          yarn npm publish --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish all packages
        if: ${{ github.event.inputs.package == '' }}
        run: |
          echo "Publishing all packages"
          yarn changeset publish --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 