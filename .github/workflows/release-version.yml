name: Version Packages

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Create a snapshot release?'
        type: boolean
        default: false
      tag:
        description: 'Tag for snapshot release (e.g., alpha, beta, next)'
        type: string
        default: 'next'
        required: false

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: yarn

      - name: Create Release PR or Snapshot
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version
          publish: yarn changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create Snapshot Release
        if: ${{ github.event.inputs.snapshot == 'true' }}
        run: |
          echo "Creating snapshot release with tag: ${{ github.event.inputs.tag }}"
          echo "@vikrai:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          yarn version:next
          git add .
          git commit -m "chore(release): snapshot release"
          yarn release:next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 